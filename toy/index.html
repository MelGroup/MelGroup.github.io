                        sans: ['Open Sans', 'Poppins', 'sans-serif'],
                        mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'Liberation Mono', 'Courier New', 'monospace'],

            <div class="flex lg:flex-1 lg:justify-end gap-x-4">

                    <div class="h-1.5 w-20 bg-gray-900 mx-auto mt-6"></div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">

                        </a>
                    </div>

                    <div class="product-card flex flex-col h-full" data-aos="fade-up" data-aos-delay="200">
                        <div class="flex items-center gap-x-4 mb-4">
                            <div class="border-2 border-gray-900 p-3 bg-blue-50 text-blue-600 hard-shadow-sm">
                                <i class="fas fa-gamepad text-3xl"></i>
                            </div>
                            <h3 class="text-2xl font-black tracking-tighter text-gray-900 font-orbitron i18n" data-i18n="game2_name">贪吃蛇</h3>
                        </div>
                        <a href="snake" class="btn-hard bg-white text-gray-900 hover:bg-gray-50 text-center mt-auto">
                            <span class="i18n" data-i18n="game2_btn">游玩贪吃蛇</span> <i class="fas fa-arrow-right ml-2 text-brand-primary"></i>
                        </a>
                    </div>

                    <div class="product-card flex flex-col h-full" data-aos="fade-up" data-aos-delay="250">
                        <div class="flex items-center gap-x-4 mb-4">
                            <div class="border-2 border-gray-900 p-3 bg-yellow-50 text-yellow-600 hard-shadow-sm">
                                <i class="fas fa-id-card text-3xl"></i>
                            </div>
                            <h3 class="text-2xl font-black tracking-tighter text-gray-900 font-orbitron i18n" data-i18n="game4_name">成员证生成站</h3>
                        </div>
                        <a href="/memcard.html" class="btn-hard bg-white text-gray-900 hover:bg-gray-50 text-center mt-auto">
                            <span class="i18n" data-i18n="game4_btn">生成成员证</span> <i class="fas fa-arrow-right ml-2 text-brand-primary"></i>
                        </a>
                    </div>
                </div>
            </div>
